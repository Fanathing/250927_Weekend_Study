<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글 생성 페이지</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/create.css">
</head>
<body>
    <header>
        <h1>Community</h1>
    </header>
    <main>
        <h2>글을 작성하라 구리</h2>
        
        <form action="/boards/create" method="post">
            <p>아이디</p>
            <input type="text" name="user_id" placeholder="아이디를 입력하세요">
            <p>작성자</p>
            <input type="text" name="writer" placeholder="작성자를 입력하세요">
            <p>제목</p>
            <input type="text" name="title" placeholder="제목을 입력하세요">
            <p>내용</p>
            <input type="text" name="content" placeholder="내용을 입력하세요">
            <button class="createPost"type="submit">작성 완료</button>
            <button class="backBtn"type="button" onclick="location.href=`/boards`">뒤로 가기</button>
        </form>

    </main>
    <footer>
        All copyrights belong to Sungyeong
    </footer>
</body>
</html>
