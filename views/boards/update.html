<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수정페이지</title>
</head>
<body>
    <header>
        <h1>Community</h1>
    </header>
    <main>
        <h2>글을 수정하라 구리</h2>
        
        <form action="/boards/update/{{ board.id }}" method="post">
            <p>작성자 수정</p>
            <input type="text" name="user_id" value="{{ board.writer }}">
            <p>제목 수정</p>
            <input type="text" name="user_id" value="{{ board.title }}">
            <p>내용 수정</p>
            <input type="text" name="user_id" value="{{ board.content }}">
            <button class="updatePost"type="submit">수정 완료</button>
        </form>

    </main>
    <footer>
        2025년은 내 것
    </footer>
</body>
</html>
