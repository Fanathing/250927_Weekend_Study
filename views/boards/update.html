<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수정페이지</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/update.css">
</head>
<body>
    <header>
        <h1>Community</h1>
    </header>
    <main>
        <h2>글을 수정하라 구리</h2>
        
        <form action="/boards/update/{{ board.id }}" method="post">
            <p>작성자 수정</p>
            <input type="text" name="writer" value="{{ board.writer }}">
            <p>제목 수정</p>
            <input type="text" name="title" value="{{ board.title }}">
            <p>내용 수정</p>
            <input type="text" name="content" value="{{ board.content }}">
            <button class="updatePost"type="submit">수정 완료</button>
            <button class="backBtn"type="button" onclick="location.href=`/boards/view/{{ board.id }}`">뒤로 가기</button>
        </form>

    </main>
    <footer>
        All copyrights belong to Sungyeong
    </footer>
</body>
</html>
